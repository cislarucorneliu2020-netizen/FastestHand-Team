ound:#294247;color:var(--ink)}.ghost{background:transparent;color:var(--muted);font-size:13px;min-height:36px;padding:8px}.danger{background:var(--red)}\n.players{display:grid;gap:9px}.player{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px}.player.active{border-color:var(--gold)}.avatar{width:35px;height:35px;display:grid;place-items:center;font-weight:900;border-radius:50%;background:var(--mint);color:#111}.player span{flex:1;font-weight:650}.player small{color:var(--muted)}\n.status{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:18px}.status b{color:var(--mint)}.card{background:#efe4cd;color:#252a2a;border:2px solid #d6b47d;box-shadow:0 8px 24px #0004;border-radius:16px;padding:25px;margin:18px 0;position:relative;overflow:hidden}.card:after{content:'FH';position:absolute;right:16px;bottom:5px;font-size:55px;font-weight:1000;opacity:.08}.card .eyebrow{color:#8a6228}.card p{color:#59615b}.card h2{font-size:28px}.private{font-size:12px;color:var(--mint);padding:12px 0}\n.weapon{width:100%;border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:14px;touch-action:pan-y;user-select:none}.weapon svg{display:block;width:100%;height:155px}.hint{font-size:13px;text-align:center;color:var(--muted);padding:6px}\n.cylinder{position:relative;width:248px;height:248px;margin:20px auto;border-radius:50%;background:radial-gradient(circle,#6c7779 0 12%,#36464b 13% 70%,#668084 71% 74%,#27373c 75%);border:3px solid #718184;box-shadow:0 10px 20px #0005;touch-action:pan-y}\n.slot{position:absolute;left:calc(50% + var(--x));top:calc(50% + var(--y));transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;border:2px solid #7a9296;background:#0b1215;display:grid;place-items:center;font-weight:800;color:#829399;min-height:0;padding:0}.slot.loaded{background:var(--gold);border-color:#ffe1a0;color:#252621} th:520px;padding:10px 14px 18px}.turn-active header,.turn-active #network,.turn-active footer{display:none}.turn-active .status{font-size:11px;margin:0 0 8px}.turn-active .card{margin:8px 0 12px;padding:14px 18px}.turn-active .card h2{margin:4px 0;font-size:20px}.turn-active .card p{margin:4px 0;font-size:13px}.turn-active .eyebrow{font-size:10px}.turn-active .cylinder{width:min(64vw,248px);height:min(64vw,248px);margin:12px auto}.turn-active .slot{width:44px;height:44px}.turn-active .ammo{padding:4px 2px 8px}.turn-active .bullet{min-width:68px;padding:8px 6px}.turn-active .full{margin-top:8px}.decision{display:grid;gap:12px;margin-top:20px}.decision button{min-height:64px;font-size:18px}.decision .secondary{border:1px solid var(--line)}\n@media(prefers-reduced-motion:no-preference){.card{animation:appear .25s ease-out}@keyframes appear{from{transform:translateY(8px);opacity:.2}to{transform:none;opacity:1}}}\n<\/style>\n<\/head>\n<body><main>\n<header><div><div class=\"brand\">FASTEST HAND<\/div><div class=\"tag\">CONTROLLER PERSONAL<\/div><\/div><div id=\"room\" class=\"code\">2D / LAN<\/div><\/header>\n<div id=\"network\" class=\"network\" role=\"status\" aria-live=\"polite\"><\/div>\n<section id=\"join\"><div class=\"eyebrow\">Un ecran. Patru adversari.<\/div><h1>La masă,<br>de pe telefon.<\/h1><p>Introdu codul afișat pe calculator. Telefonul și gazda trebuie să fie în aceeași rețea Wi-Fi.<\/p>\n<form id=\"join-form\"><label for=\"code\">Codul camerei<\/label><input id=\"code\" class=\"code-input\" inputmode=\"numeric\" maxlength=\"6\" autocomplete=\"off\" placeholder=\"000000\" required>\n<label for=\"name\">Numele tău<\/label><input id=\"name\" maxlength=\"18\" autocomplete=\"nickname\" placeholder=\"Cum te numești?\" required><button id=\"join-button\" class=\"full\" type=\"submit\">INTRĂ ÎN CAMERĂ →<\/button><\/form><\/section>\n<section id=\"game\" class=\"hidden\"><\/section><footer>FASTEST HAND · HTML<\/footer>\n<\/main><div id=\"toast\" class=\"toast hidden\" role=\"alert\"><\/div>\n<script>\n'use strict';\nconst $=s=>document.querySelector(s), storage={get(k){try{return localStorage.getItem('fhhtml:'+k)||''}catch{return ''}},set(k,v){try{localStorage.setItem('fhhtml:'+k,v)}catch{}}};\nlet token=storage.get('token'),state=null,busy=false,polling=false,dragging=false,selected='',renderKey='',toastTimer,failures=0;\nconst nonce=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);\nconst escapeHtml=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nfunction toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4500)}\nasync function request(url,data){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6000);try{const r=await fetch(url,{method:data?'POST':'GET',headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined,cache:'no-store',signal:controller.signal});return await r.json()}finally{clearTimeout(timeout)}}\nfunction logout(){token='';storage.set('token','');state=null;renderKey='';$('#join').classList.remove('hidden');$('#game').classList.add('hidden');$('#room').textContent='2D / LAN'}\n$('#code').value=new URLSearchParams(location.search).get('code')||storage.get('code');$('#name').value=storage.get('name');\n$('#join-form').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;$('#join-button').disabled=true;const code=$('#code').value.trim(),name=$('#name').value.trim();let id=storage.get('joinRequest');if(!id||storage.get('joinCode')!==code||storage.get('joinName')!==name){id=nonce();storage.set('joinRequest',id);storage.set('joinCode',code);storage.set('joinName',name)}try{const s=await request('/api/join',{code,name,token,requestId:id});if(!s.ok)throw Error(s.error||'Nu poți intra acum.');token=s.token;storage.set('token',token);storage.set
